name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:site

  latex-compiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate the corpus
        run: node test/compile-corpus.mjs --out /tmp/corpus --days 7
      - name: Compile with Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tectonic-version: "0.17.0"
      - name: Cache Tectonic packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-${{ runner.os }}
      - run: |
          for i in 1 2 3; do
            tectonic /tmp/corpus/corpus.tex --outdir /tmp/corpus && break
            echo "tectonic attempt $i failed; retrying in 30s"
            sleep 30
          done
          test -f /tmp/corpus/corpus.pdf
