name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - name: Version asset URLs so stale caches cannot mix deploys
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s#href=\"style.css\"#href=\"style.css?v=$v\"#" site/index.html
          sed -i "s#src=\"main.js\"#src=\"main.js?v=$v\"#" site/index.html
          sed -i "s#./chartjunk.esm.js#./chartjunk.esm.js?v=$v#" site/main.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
