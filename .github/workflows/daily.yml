name: Daily figure

on:
  schedule:
    # The 18:00 run backfills automatically if the noon run failed.
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-figure
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate the figure of the day
        id: gen
        run: |
          seed=$(date -u +%F)
          npx esbuild src/cli.ts --bundle --format=esm --platform=node --outfile=/tmp/cli.mjs
          node /tmp/cli.mjs --seed "$seed" -o "chartjunk-$seed.svg"
          node /tmp/cli.mjs --seed "$seed" -f tikz -o "chartjunk-$seed.tex"
          node /tmp/cli.mjs --seed "$seed" -f json -o /tmp/fig.json
          node /tmp/cli.mjs --preamble > /tmp/preamble.tex
          # Tectonic resolves \input relative to the wrapper document, so
          # the wrapper lives beside the figure it inputs.
          { printf '%s\n' '\documentclass{article}' '\pagestyle{empty}'
            cat /tmp/preamble.tex
            printf '%s\n' '\begin{document}' "\\input{chartjunk-$seed.tex}" '\end{document}'
          } > "doc-$seed.tex"
          title=$(node -e "const f=require('/tmp/fig.json');const t=f.caption.runs.map(r=>r.k==='cite'?'['+r.ids.join(', ')+']':r.k==='math'?r.text:r.s).join('');console.log(('Figure '+f.seed+': '+t).split('. ')[0].slice(0,120))")
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Skip if already published today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seed="${{ steps.gen.outputs.seed }}"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && gh release view "daily-$seed" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tectonic-version: "0.17.0"
      - name: Cache Tectonic packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-${{ runner.os }}
      - name: Compile the PDF
        if: steps.check.outputs.published == 'false'
        run: |
          seed="${{ steps.gen.outputs.seed }}"
          for i in 1 2 3; do
            tectonic "doc-$seed.tex" --outdir . && break
            echo "tectonic attempt $i failed; retrying in 30s"
            sleep 30
          done
          mv "doc-$seed.pdf" "chartjunk-$seed.pdf"
          test -f "chartjunk-$seed.pdf"
      - name: Publish release
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seed="${{ steps.gen.outputs.seed }}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh release delete "daily-$seed" --yes --cleanup-tag 2>/dev/null || true
          fi
          for i in 1 2 3; do
            gh release create "daily-$seed" \
              --title "${{ steps.gen.outputs.title }}" \
              --notes "Figure of the day, seed \`$seed\`. Reproduce it at https://mithrilbytes.github.io/chartjunk/?seed=$seed" \
              "chartjunk-$seed.svg" "chartjunk-$seed.tex" "chartjunk-$seed.pdf" && break
            echo "release attempt $i failed; retrying in 20s"
            sleep 20
          done
          gh release view "daily-$seed" >/dev/null
      - name: Compile the week ahead
        run: |
          node test/compile-corpus.mjs --out /tmp/corpus --days 7
          for i in 1 2 3; do
            tectonic /tmp/corpus/corpus.tex --outdir /tmp/corpus && break
            echo "tectonic attempt $i failed; retrying in 30s"
            sleep 30
          done
          test -f /tmp/corpus/corpus.pdf
      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily figure workflow failed"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "See $url. The 18:00 UTC run retries automatically."
          fi
      - name: Close the failure issue after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily figure workflow failed"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Recovered: $url"
          fi
